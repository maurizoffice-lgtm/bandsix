<title>TOEFL Trainer 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a test-delivery console. Sticky status bar (section, progress, clock), one centred work column, passages split left/right on wide screens. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#152033; --muted:#5a6880; --line:#d6dee9;
  --accent:#1b5ccc; --accent-soft:#e4edfc; --accent-ink:#ffffff;
  --good:#1d7f52; --good-soft:#e2f4ea; --bad:#bf3434; --bad-soft:#fbe7e7; --warn:#a86a10; --warn-soft:#fbf0dc;
  --sec-r:#0f7a7a; --sec-l:#6a43c2; --sec-w:#b4630c; --sec-s:#c23a6a;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,51,.06),0 4px 14px rgba(20,32,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1b2536; --ink:#e5ebf4; --muted:#93a2b8; --line:#2a3649;
  --accent:#6f9fff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
  --good:#4fc48a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1a1c; --warn:#e8b155; --warn-soft:#352a14;
  --sec-r:#4cc4c4; --sec-l:#a88bf0; --sec-w:#eea25a; --sec-s:#f07aa5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1b2536; --ink:#e5ebf4; --muted:#93a2b8; --line:#2a3649;
  --accent:#6f9fff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
  --good:#4fc48a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1a1c; --warn:#e8b155; --warn-soft:#352a14;
  --sec-r:#4cc4c4; --sec-l:#a88bf0; --sec-w:#eea25a; --sec-s:#f07aa5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,38px)} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.bar .spacer{flex:1}
.secchip{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.sec-reading{color:var(--sec-r)} .sec-listening{color:var(--sec-l)} .sec-writing{color:var(--sec-w)} .sec-speaking{color:var(--sec-s)}
.clock{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.clock.low{color:var(--bad);border-color:var(--bad)}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:3px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

main{padding-block:28px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.countdown{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.countdown .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.countdown .lines{font-size:14px;opacity:.92}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
button.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card .meta{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.typelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.type{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.type .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.type .ico svg{width:20px;height:20px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* test stage */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-height:calc(100vh - 150px);overflow:auto;white-space:pre-line}
.passage h3{margin-bottom:10px}
.passage p+p{margin-top:12px}
.docbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;white-space:pre-line;font-size:15px}
.dockind{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 12px;width:100%}
.opt .l{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:10px}
.explain.good{border-color:var(--good)} .explain.bad{border-color:var(--bad)}
.directions{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}

/* complete the words */
.cw{font-size:17px;line-height:2.2}
.cw .stem{white-space:nowrap}
.cw input{font:inherit;font-family:var(--f-mono);font-size:16px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:0 3px;border-radius:3px 3px 0 0;color:var(--ink);letter-spacing:.12em}
.cw input.right{border-color:var(--good);background:var(--good-soft)}
.cw input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cw .fix{font-size:12px;color:var(--good);font-family:var(--f-mono);vertical-align:super;margin-left:2px}

/* listening / speaker card */
.stagecard{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.avatars{display:flex}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;color:#fff;position:relative;border:3px solid var(--surface)}
.av + .av{margin-left:-14px}
.av.talk::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--accent);animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.94);opacity:.9}50%{transform:scale(1.06);opacity:.35}}
.wave{display:flex;gap:3px;align-items:center;height:28px;margin-top:8px}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:5px;transition:height .15s}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.15s}.wave.on i:nth-child(3n){animation-delay:.3s}.wave.on i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:26px}}
.transcript{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px}
.transcript .ln{margin:4px 0}
.transcript b{font-family:var(--f-display)}
.scene{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.scene svg{width:100%;height:auto;border-radius:10px}

/* build a sentence */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:16px}
.slot{min-width:84px;min-height:36px;border:1.5px dashed var(--muted);border-radius:7px;padding:5px 10px;background:var(--surface)}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot.right{border-color:var(--good);background:var(--good-soft)} .slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;box-shadow:var(--shadow)}
.tile:disabled{opacity:.25;box-shadow:none}

/* writing */
textarea{width:100%;min-height:240px;font:16px/1.6 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.wc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.forum{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.post .pic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display)}
.post.prof{border-color:var(--accent)}
.post .nm{font-weight:600;font-size:14px}

/* speaking */
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--sec-s);color:#fff;display:grid;place-items:center}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sec-s) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.live{min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:15px}
.live .part{color:var(--muted)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--sec-s) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px}
.diff span{padding:0 2px;border-radius:3px}
.diff .hit{background:var(--good-soft);color:var(--good)} .diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}

/* results */
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.bandtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.bandtile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bandtile.overall{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bandtile.overall .muted{color:inherit;opacity:.85}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden} .meter i{display:block;height:100%;background:currentColor}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
.ai{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2)}
.ai ul{margin:6px 0 0;padding-left:20px}
.rubric{display:flex;gap:6px;flex-wrap:wrap}
.rubric button{min-width:40px}
.rubric button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

@media (max-width:820px){
  .hero,.split,.grid2,.grid3,.typelist{grid-template-columns:1fr}
  .bands{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bandtile.overall{grid-column:1/-1}
  .passage{max-height:none}
  .stagecard,.scene{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bar" id="bar"><div class="wrap" id="barInner"></div><div class="pbar" id="pbar" hidden><i></i></div></div>
<main><div class="wrap" id="app"></div></main>
<div class="toast" id="toast" hidden></div>
