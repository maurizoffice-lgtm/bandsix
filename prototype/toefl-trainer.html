<title>TOEFL Trainer 2026</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a test-delivery console. Sticky status bar (section, progress, clock), one centred work column, passages split left/right on wide screens. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#152033; --muted:#5a6880; --line:#d6dee9;
  --accent:#1b5ccc; --accent-soft:#e4edfc; --accent-ink:#ffffff;
  --good:#1d7f52; --good-soft:#e2f4ea; --bad:#bf3434; --bad-soft:#fbe7e7; --warn:#a86a10; --warn-soft:#fbf0dc;
  --sec-r:#0f7a7a; --sec-l:#6a43c2; --sec-w:#b4630c; --sec-s:#c23a6a;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,32,51,.06),0 4px 14px rgba(20,32,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1b2536; --ink:#e5ebf4; --muted:#93a2b8; --line:#2a3649;
  --accent:#6f9fff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
  --good:#4fc48a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1a1c; --warn:#e8b155; --warn-soft:#352a14;
  --sec-r:#4cc4c4; --sec-l:#a88bf0; --sec-w:#eea25a; --sec-s:#f07aa5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141e; --surface:#161f2d; --surface-2:#1b2536; --ink:#e5ebf4; --muted:#93a2b8; --line:#2a3649;
  --accent:#6f9fff; --accent-soft:#1c2a45; --accent-ink:#0b1220;
  --good:#4fc48a; --good-soft:#15301f; --bad:#ff7b7b; --bad-soft:#3a1a1c; --warn:#e8b155; --warn-soft:#352a14;
  --sec-r:#4cc4c4; --sec-l:#a88bf0; --sec-w:#eea25a; --sec-s:#f07aa5; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,38px)} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand .mk{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.bar .spacer{flex:1}
.secchip{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
.sec-reading{color:var(--sec-r)} .sec-listening{color:var(--sec-l)} .sec-writing{color:var(--sec-w)} .sec-speaking{color:var(--sec-s)}
.clock{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.clock.low{color:var(--bad);border-color:var(--bad)}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:3px;background:var(--line)} .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}

main{padding-block:28px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:600;border:1px solid var(--line);background:var(--surface);min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{min-height:34px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.countdown{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.countdown .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.countdown .lines{font-size:14px;opacity:.92}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:left}
button.card:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.card .meta{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.typelist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.type{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.type .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.type .ico svg{width:20px;height:20px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* test stage */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-height:calc(100vh - 150px);overflow:auto;white-space:pre-line}
.passage h3{margin-bottom:10px}
.passage p+p{margin-top:12px}
.docbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;white-space:pre-line;font-size:15px}
.dockind{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.q .qt{font-weight:600;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 12px;width:100%}
.opt .l{font-family:var(--f-mono);font-size:13px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);background:var(--surface-2);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-top:10px}
.explain.good{border-color:var(--good)} .explain.bad{border-color:var(--bad)}
.directions{background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}

/* complete the words */
.cw{font-size:17px;line-height:2.2}
.cw .stem{white-space:nowrap}
.cw input{font:inherit;font-family:var(--f-mono);font-size:16px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);padding:0 3px;border-radius:3px 3px 0 0;color:var(--ink);letter-spacing:.12em}
.cw input.right{border-color:var(--good);background:var(--good-soft)}
.cw input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cw .fix{font-size:12px;color:var(--good);font-family:var(--f-mono);vertical-align:super;margin-left:2px}

/* listening / speaker card */
.stagecard{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.avatars{display:flex}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;color:#fff;position:relative;border:3px solid var(--surface)}
.av + .av{margin-left:-14px}
.av.talk::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--accent);animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(.94);opacity:.9}50%{transform:scale(1.06);opacity:.35}}
.wave{display:flex;gap:3px;align-items:center;height:28px;margin-top:8px}
.wave i{width:4px;border-radius:2px;background:var(--accent);height:5px;transition:height .15s}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2n){animation-delay:.15s}.wave.on i:nth-child(3n){animation-delay:.3s}.wave.on i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:26px}}
.transcript{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px}
.transcript .ln{margin:4px 0}
.transcript b{font-family:var(--f-display)}
.scene{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.scene svg{width:100%;height:auto;border-radius:10px}

/* build a sentence */
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.slots{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:16px}
.slot{min-width:84px;min-height:36px;border:1.5px dashed var(--muted);border-radius:7px;padding:5px 10px;background:var(--surface)}
.slot.filled{border-style:solid;border-color:var(--accent)}
.slot.right{border-color:var(--good);background:var(--good-soft)} .slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;box-shadow:var(--shadow)}
.tile:disabled{opacity:.25;box-shadow:none}

/* writing */
textarea{width:100%;min-height:240px;font:16px/1.6 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.wc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.forum{display:flex;flex-direction:column;gap:10px}
.post{display:grid;grid-template-columns:40px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.post .pic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-display)}
.post.prof{border-color:var(--accent)}
.post .nm{font-weight:600;font-size:14px}

/* speaking */
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--sec-s);color:#fff;display:grid;place-items:center}
.mic svg{width:34px;height:34px}
.mic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sec-s) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.live{min-height:52px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:15px}
.live .part{color:var(--muted)}
.ring{--p:0;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--sec-s) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:66px;height:66px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:18px}
.diff span{padding:0 2px;border-radius:3px}
.diff .hit{background:var(--good-soft);color:var(--good)} .diff .miss{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}

/* results */
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.bandtile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.bandtile .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bandtile.overall{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bandtile.overall .muted{color:inherit;opacity:.85}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden} .meter i{display:block;height:100%;background:currentColor}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details+details{margin-top:8px}
summary{cursor:pointer;font-weight:600}
.ai{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2)}
.ai ul{margin:6px 0 0;padding-left:20px}
.rubric{display:flex;gap:6px;flex-wrap:wrap}
.rubric button{min-width:40px}
.rubric button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
.settings{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px}
select{font:inherit;padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

@media (max-width:820px){
  .hero,.split,.grid2,.grid3,.typelist{grid-template-columns:1fr}
  .bands{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bandtile.overall{grid-column:1/-1}
  .passage{max-height:none}
  .stagecard,.scene{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ================= CONTENT POOL v2 (original items, calibrated to the ETS 2026 blueprint, upper-module difficulty) ================= */
const POOL = {};

/* ---------- READING: Complete the Words (C1 academic, 10 blanks each) ---------- */
POOL.cw = [
 {id:"cw1", title:"Urban Heat Islands",
  text:"Metropolitan areas are frequently several degrees warmer than the surrounding countryside. This phenomenon, known as the urban heat island, arises largely because impervious surfaces such as asphalt absorb solar radiation during the day and release it gradually after sunset. Dense buildings also restrict ventilation, which prevents accumulated heat from dissipating efficiently. Consequently, municipal planners increasingly incorporate vegetation, reflective roofing materials and permeable pavements into development strategies in order to mitigate these thermal effects."},
 {id:"cw2", title:"Honeybee Communication",
  text:"Honeybees convey remarkably precise information about distant food sources. A returning forager performs a so called waggle dance on the vertical surface of the comb, and the orientation of this movement encodes the direction of the flowers relative to the sun. The duration of each waggle run, meanwhile, indicates the approximate distance the colony must travel. Researchers who decoded this behaviour demonstrated that insects with comparatively simple nervous systems can nonetheless transmit abstract spatial information."},
 {id:"cw3", title:"The Printing Press",
  text:"The introduction of movable type in fifteenth century Europe transformed the circulation of knowledge. Before this innovation, manuscripts were reproduced laboriously by hand, which rendered them scarce and prohibitively expensive. A single workshop could suddenly produce hundreds of identical copies within weeks, and the resulting decline in prices broadened literacy considerably. Historians emphasise that standardised texts also enabled scholars in distant cities to compare findings directly, thereby accelerating scientific and religious debates across national boundaries."},
 {id:"cw4", title:"Sleep and Memory Consolidation",
  text:"Neuroscientists have long suspected that sleep contributes substantially to learning. Recent experimental evidence supports this hypothesis quite convincingly. Participants who slept shortly after memorising vocabulary retained significantly more items than participants who remained awake for an equivalent interval. During slow wave sleep, the hippocampus appears to reactivate recently acquired information and gradually transfer it to cortical regions, where memories become more stable and less vulnerable to interference from subsequent experiences."},
 {id:"cw5", title:"Coral Bleaching",
  text:"Coral reefs occupy less than one percent of the ocean floor. Nevertheless, they sustain roughly a quarter of all documented marine species. Each reef is constructed by colonies of tiny animals that secrete calcium carbonate skeletons over many centuries. These organisms depend on symbiotic algae that supply nutrients through photosynthesis. When water temperatures rise persistently, the corals expel these algae, lose their characteristic colouration and become highly susceptible to disease, a process commonly described as bleaching."},
 {id:"cw6", title:"Resilient Supply Chains",
  text:"Contemporary manufactured goods rarely originate in a single factory. A typical smartphone, for instance, incorporates components fabricated in more than a dozen countries. Firms coordinate these flows through elaborate global supply chains designed primarily to minimise costs. However, recent disruptions revealed that highly optimised networks are surprisingly fragile, since a delay at one critical supplier can halt production worldwide. Many companies are therefore diversifying their sourcing and maintaining larger buffer inventories despite the additional expense."},
 {id:"cw7", title:"Linguistic Relativity",
  text:"Whether language shapes thought has been debated for nearly a century. Early proponents claimed that speakers of different languages perceive reality in fundamentally incompatible ways. Contemporary researchers generally reject this strong version but accept that grammatical categories can subtly influence attention and memory. Speakers of languages that require speakers to specify whether an event was witnessed directly, for example, tend to recall the source of information more reliably than speakers whose languages lack such obligatory markers."},
 {id:"cw8", title:"Behavioural Economics",
  text:"Classical economic models assume that individuals make rational decisions based on complete information. Behavioural economists challenge this assumption by documenting systematic deviations from rationality. People frequently overvalue immediate rewards, rely on mental shortcuts and respond differently to identical choices depending on how options are framed. Governments have begun applying these insights through so called nudges, such as automatic enrolment in pension schemes, which substantially increase participation without restricting individual freedom of choice."}

 {id:"ac1", title:"The Domestication of Cats",
  text:"For much of the twentieth century, historians attributed the domestication of cats to ancient Egypt, where feline imagery pervades art from roughly 4,000 years ago and where cats were routinely mummified. Archaeological findings over recent decades, however, have pushed this chronology back considerably. In 2004, excavators on Cyprus uncovered a burial dating to approximately 9,500 years ago in which a cat had been deliberately interred beside a human. Because wild cats are not native to the island, the animal must have been transported there by boat, implying a relationship that was already more than incidental.\n\nMost researchers now contend that domestication proceeded not through deliberate human selection but through a gradual process of mutual accommodation. As early agricultural communities in the Near East began storing surplus grain, their granaries attracted rodents, which in turn drew wild cats. Individuals that tolerated human proximity gained access to a reliable food supply, while farmers benefited from reduced crop losses. Over many generations, these commensal populations diverged genetically from their wild counterparts. Proponents of this view suggest that cats essentially domesticated themselves, an interpretation that may account for the comparative independence that distinguishes modern house cats from dogs, whose breeding has been far more intensively directed by humans.",
  qs:[
   {q:"According to paragraph 1, why is the discovery on Cyprus significant?", o:["It confirms that cats were first domesticated in Egypt","It indicates a close human–cat relationship much earlier than previously assumed","It is the earliest known depiction of cats in art","It proves that wild cats originally inhabited Cyprus"], a:1, ex:"Der Fund ist ca. 9.500 Jahre alt, also viel älter als die ägyptische Datierung."},
   {q:"Which of the following can be inferred about the cat found on Cyprus?", o:["It had been mummified according to Egyptian custom","It was brought to the island by people","It belonged to a wild population native to the island","It was buried several centuries after its owner"], a:1, ex:"Wildkatzen sind dort nicht heimisch, also muss sie mit Menschen per Boot gekommen sein."},
   {q:"The word \"commensal\" in paragraph 2 refers to populations that", o:["were bred deliberately by farmers","lived alongside humans and benefited from them","competed with humans for grain","remained completely wild"], a:1, ex:"Kontext: Katzen lebten nahe bei Menschen und profitierten davon. commensal = mitessend, nebeneinander lebend."},
   {q:"According to the passage, what initially attracted wild cats to human settlements?", o:["Meat left over from hunting","Shelter provided in granaries","Rodents drawn by stored grain","Food deliberately offered by farmers"], a:2, ex:"Getreidelager zogen Nagetiere an, und die Nagetiere zogen Katzen an."},
   {q:"Why does the author mention dogs in the final sentence?", o:["To argue that dogs were domesticated before cats","To contrast the extent of human control over their breeding with that of cats","To suggest that cats and dogs share a common ancestor","To explain why farmers preferred dogs to cats"], a:1, ex:"Rhetorische Funktion: Kontrast. Hunde wurden viel stärker gezielt gezüchtet, deshalb sind Katzen unabhängiger."}
  ]},
 {id:"ac2", title:"Continental Drift and Plate Tectonics",
  text:"In 1912 the German meteorologist Alfred Wegener proposed that the continents had once formed a single landmass, which he termed Pangaea, and had subsequently drifted apart. He cited the complementary outlines of South America and Africa, as well as identical fossil species found on continents now separated by thousands of kilometers of ocean. Despite this evidence, the geological establishment largely dismissed his hypothesis for several decades. The principal objection was not to his observations but to his inability to identify a plausible mechanism capable of propelling continents across the Earth's surface.\n\nThe missing mechanism emerged only after the Second World War, when sonar technology enabled detailed mapping of the ocean floor. Scientists discovered extensive submarine mountain chains, now called mid-ocean ridges, where molten material ascends from the mantle and solidifies into new crust. Magnetometer surveys revealed that the rocks on either side of these ridges exhibited symmetrical bands of alternating magnetic polarity, a pattern that could be explained only if newly formed crust spread outward while recording periodic reversals of the Earth's magnetic field. By the late 1960s these findings had been synthesized into the theory of plate tectonics, which holds that the lithosphere is fragmented into rigid plates moving a few centimeters annually.",
  qs:[
   {q:"According to paragraph 1, why did most geologists initially reject Wegener's hypothesis?", o:["His fossil evidence was shown to be inaccurate","He could not explain what caused the continents to move","He was a meteorologist rather than a geologist","The coastlines of South America and Africa do not match"], a:1, ex:"„The principal objection was not to his observations but to his inability to identify a plausible mechanism“."},
   {q:"Which of the following did Wegener use to support his hypothesis?", o:["Magnetic bands on the ocean floor","The matching shapes of continental coastlines","Sonar maps of mid-ocean ridges","Measurements of annual plate movement"], a:1, ex:"Nur Küstenlinien (und Fossilien) stammen von Wegener. Die anderen Belege kamen erst nach dem Zweiten Weltkrieg."},
   {q:"The word \"plausible\" in paragraph 1 is closest in meaning to", o:["believable","visible","powerful","original"], a:0, ex:"plausible = glaubwürdig, einleuchtend = believable."},
   {q:"What is the function of the discussion of magnetic bands in paragraph 2?", o:["To present a weakness in the theory of plate tectonics","To explain how compasses were improved after the war","To identify key evidence that the sea floor is spreading","To show that the Earth's magnetic field has remained stable"], a:2, ex:"Die symmetrischen Bänder sind der zentrale Beleg für die Ausbreitung des Meeresbodens."},
   {q:"Which sentence best expresses the essential information in the passage?", o:["Wegener's observations about coastlines and fossils were later shown to be mistaken, so a new theory replaced his.","Evidence discovered decades later supplied the mechanism that Wegener's idea lacked, leading to plate tectonics.","Sonar mapping after the Second World War was the first evidence that the continents had once been joined.","Geologists accepted continental drift once Wegener identified the force that moves the continents."], a:1, ex:"Zusammenfassung: Später entdeckte Belege lieferten den fehlenden Mechanismus, daraus entstand die Plattentektonik."}
  ]},
 {id:"ac3", title:"The Bystander Effect",
  text:"In the 1960s a widely publicized crime in New York prompted psychologists John Darley and Bibb Latané to investigate why individuals sometimes fail to assist others in emergencies. In one experiment, participants engaged in a discussion via intercom when another participant, in reality a recording, appeared to suffer a seizure. When participants believed they were the only other listener, 85 percent left their cubicle to seek help before the recording ended. When they believed four others were also listening, only 31 percent did so.\n\nDarley and Latané labeled this pattern the bystander effect and advanced two complementary explanations. The first, diffusion of responsibility, holds that the presence of others dilutes each individual's sense of personal obligation, as everyone assumes that someone else will intervene. The second concerns social influence: in ambiguous situations, people monitor others' reactions to determine whether an emergency is genuinely occurring, and if no one responds, each observer concludes that intervention is unnecessary. Subsequent research has qualified these findings, showing that the effect diminishes when the danger is unmistakable or when bystanders are acquainted. Nonetheless, first-aid instructors now routinely advise trainees to single out a specific person and issue a direct instruction, a strategy explicitly designed to counteract diffusion of responsibility.",
  qs:[
   {q:"What was the purpose of the intercom experiment?", o:["To assess participants' medical knowledge","To determine how the perceived number of listeners affects helping","To measure how quickly seizures can be treated","To compare students from different universities"], a:1, ex:"Variiert wurde die vermeintliche Zahl der Zuhörer (1 vs. 4)."},
   {q:"The word \"dilutes\" in paragraph 2 is closest in meaning to", o:["strengthens","weakens","reveals","replaces"], a:1, ex:"dilute = verdünnen, abschwächen = weaken."},
   {q:"According to paragraph 2, how does social influence contribute to the bystander effect?", o:["People fear criticism if they act incorrectly","People interpret others' inaction as a sign that help is not needed","People prefer to follow the instructions of experts","People avoid helping strangers in large cities"], a:1, ex:"Wenn niemand reagiert, schließt jeder, dass keine Hilfe nötig ist."},
   {q:"The author mentions research showing that \"the effect diminishes when the danger is unmistakable\" in order to", o:["reject Darley and Latané's findings entirely","indicate that the bystander effect has limits","prove that diffusion of responsibility does not exist","explain why first-aid courses are ineffective"], a:1, ex:"„qualified these findings“: Die Ergebnisse werden eingeschränkt, nicht verworfen."},
   {q:"Which of the following can be inferred from the passage about the first-aid strategy?", o:["It relies on the social-influence explanation alone","It assigns responsibility to one person so it is no longer shared","It is effective only when bystanders know each other","It was invented by Darley and Latané"], a:1, ex:"Die direkte Ansprache weist einer Person die Verantwortung zu und hebt so die Verantwortungsdiffusion auf."}
  ]},
 {id:"ac4", title:"The Origins of Lean Production",
  text:"In the aftermath of the Second World War, Japanese automobile manufacturers confronted conditions that rendered American mass-production methods impractical. Domestic demand was modest yet highly varied, capital was scarce, and factories could not afford to accumulate vast inventories of components. At Toyota, the engineer Taiichi Ohno responded by developing what Western analysts would later call lean production, a philosophy centered on the systematic elimination of waste, defined as any activity that consumes resources without creating value for the customer.\n\nA cornerstone of this system was the just-in-time principle. Rather than manufacturing large batches and storing them, each process produced only what the subsequent process required, precisely when it was required. Cards known as kanban circulated between workstations to authorize production. Paradoxically, the resulting scarcity of buffer stock was regarded as an advantage, because defects and bottlenecks that inventories might otherwise conceal became immediately apparent, and workers were empowered to halt the line in order to resolve root causes. Critics contend that such tightly coupled systems are acutely vulnerable to external disruptions, a concern amplified by recent global supply crises. Lean principles have nevertheless proliferated well beyond automobile manufacturing and now inform practice in healthcare, software development and public administration.",
  qs:[
   {q:"According to paragraph 1, why were American mass-production methods unsuitable for postwar Japanese manufacturers?", o:["Japanese workers lacked technical training","Limited capital and varied demand made large inventories unaffordable","American firms refused to share their methods","The Japanese government prohibited large factories"], a:1, ex:"Knappes Kapital, kleine und vielfältige Nachfrage, also keine großen Lagerbestände möglich."},
   {q:"The word \"authorize\" in paragraph 2 is closest in meaning to", o:["permit","inspect","delay","calculate"], a:0, ex:"authorize = genehmigen = permit."},
   {q:"Why does the author describe the scarcity of buffer stock as \"paradoxically\" advantageous?", o:["Because low stock usually leads to higher profits","Because a shortage would normally be seen as a weakness, yet it exposed problems","Because workers preferred to work with fewer components","Because kanban cards replaced the need for inventory entirely"], a:1, ex:"Paradox: Was normalerweise ein Nachteil ist (wenig Puffer), wird zum Vorteil, weil Probleme sichtbar werden."},
   {q:"According to the passage, which of the following is a criticism of lean production?", o:["It increases the amount of waste","It is difficult to apply outside Japan","It is highly sensitive to supply disruptions","It reduces the authority of workers"], a:2, ex:"„acutely vulnerable to external disruptions“."},
   {q:"Which of the following best describes the organization of the passage?", o:["A problem is described, a solution is explained, and its limitations and spread are noted","Two competing theories are compared and one is rejected","A historical event is described in strict chronological order without evaluation","An experiment is described and its results are analyzed"], a:0, ex:"Aufbau: Problem (Nachkriegsbedingungen), Lösung (Lean, JIT), Kritik und Verbreitung."}
  ]}
];

 {id:"lc1", v:"airy", s:"Did the professor ever post the slides from Tuesday?", o:["Check the course page, I think they went up last night.","She usually posts them before the lecture, not after.","I missed Tuesday's lecture too, unfortunately.","The slides were mostly about last week's reading."], a:0, ex:"Gefragt ist, ob die Folien online sind. A beantwortet das indirekt. B ist allgemein und beantwortet nicht, ob es passiert ist. C und D gehen am Kern vorbei."},
 {id:"lc2", v:"glassy", s:"Would you mind if I opened the window?", o:["Not at all, it's pretty stuffy in here.","Yes, I'd be glad to open it for you.","I don't mind which window we sit by.","It was open earlier this morning."], a:0, ex:"„Would you mind if I…?“: „Not at all“ heißt Zustimmung. B verwechselt Erlaubnis mit Angebot. C ist eine Wortfalle (mind)."},
 {id:"lc3", v:"rounded", s:"How long did the assignment end up taking you?", o:["Longer than I'd like to admit.","I'm planning to start it this weekend.","It's due a week from Friday.","About ten pages, including the appendix."], a:0, ex:"„How long did it take“ fragt nach Dauer in der Vergangenheit. B passt zeitlich nicht, C beantwortet „when“, D beantwortet „how long“ im Sinne von Seiten."},
 {id:"lc4", v:"buttery", s:"I can't believe the bookstore's already closed.", o:["They close early on Sundays.","I can't believe how expensive textbooks are.","It's just around the corner from here.","I need to buy a new notebook."], a:0, ex:"A erklärt den Grund. B, C und D reagieren nicht auf die Schließung. B wiederholt die Struktur, wechselt aber das Thema."},
 {id:"lc5", v:"airy", s:"Why don't we meet at the library instead?", o:["Fine by me, it's quieter anyway.","Because the café was too crowded last time.","I don't know why it closed early.","The library has three floors."], a:0, ex:"„Why don't we…?“ ist ein Vorschlag. B behandelt ihn als echte Warum-Frage. C und D gehen am Vorschlag vorbei."},
 {id:"lc6", v:"glassy", s:"Have you heard back about the internship?", o:["Only an automated reply so far.","I applied to three different companies.","The internship would start in June.","I'll call you back after my class."], a:0, ex:"A: noch keine echte Rückmeldung. C würde eine Rückmeldung voraussetzen, passt aber nicht zu „heard back“ im Sinne von Ergebnis. D ist eine Wortfalle (back)."},
 {id:"lc7", v:"rounded", s:"Is anyone sitting here?", o:["My friend just stepped out, sorry.","I usually sit near the front.","There are more chairs in the back.","Yes, please have a seat."], a:0, ex:"A: Platz belegt, indirekt. D widerspricht sich (Ja, jemand sitzt hier, aber setz dich). C ist hilfreich, beantwortet aber nicht die Frage."},
 {id:"lc8", v:"buttery", s:"Any chance you could look over my cover letter before Friday?", o:["Send it over tonight and I'll take a look.","I already submitted mine on Monday.","Friday's deadline was moved, wasn't it?","Cover letters usually shouldn't exceed one page."], a:0, ex:"Bitte, natürliche Reaktion ist Zusage. B, C und D sind thematisch nah, reagieren aber nicht auf die Bitte."},
 {id:"lc9", v:"airy", s:"Which bus goes to the science park?", o:["You'd be better off taking the tram.","Every fifteen minutes or so.","It takes about twenty minutes from here.","The stop is right outside the main gate."], a:0, ex:"„Which bus“ fragt nach der Linie. A ist eine indirekte, hilfreiche Antwort. B (wie oft), C (wie lange) und D (wo) beantworten andere Fragen."},
 {id:"lc10", v:"glassy", s:"Weren't you supposed to present today?", o:["They pushed it back to Thursday.","Yes, and I spent all weekend preparing.","I'm supposed to meet my advisor at three.","The presentation was about urban planning."], a:0, ex:"A erklärt, warum nicht heute. B bestätigt, erklärt aber nicht, warum er dann hier ist. C ist eine Strukturfalle (supposed to)."},
 {id:"lc11", v:"rounded", s:"The printer's jammed again.", o:["Try the one in the hallway.","I printed my essay yesterday.","It prints in color, too.","How many pages do you need?"], a:0, ex:"A bietet eine Lösung. Die anderen helfen nicht weiter."},
 {id:"lc12", v:"buttery", s:"What did you make of the guest lecture?", o:["Some interesting points, but it dragged on a bit.","I made it just before it started.","She's giving another one next month.","It was held in the main auditorium."], a:0, ex:"„What did you make of…?“ fragt nach der Meinung. B ist eine Wortfalle (make it = es schaffen)."},
 {id:"lc13", v:"airy", s:"Should I bring anything to the study group?", o:["Maybe your notes from last week.","We're meeting at seven, I think.","Only four people have signed up so far.","I brought snacks the last time."], a:0, ex:"A beantwortet, was man mitbringen soll. D ist thematisch nah, aber keine Antwort."},
 {id:"lc14", v:"glassy", s:"Sorry, I didn't catch your name.", o:["It's Daniel. Daniel Ortiz.","No problem, I'm in your statistics class.","I didn't catch the bus either.","We met at orientation, remember?"], a:0, ex:"„didn't catch“ = nicht verstanden. A wiederholt den Namen. B und D sind höflich, nennen ihn aber nicht."},
 {id:"lc15", v:"rounded", s:"You're not taking statistics this term, are you?", o:["Actually, I had to, it's a prerequisite.","No, I'm taking it this term.","The statistics course is really popular.","I took economics last term instead."], a:0, ex:"A widerspricht höflich mit Grund. B ist in sich widersprüchlich (No + taking it). D passt nicht zu „this term“."},

 {id:"tk1", v:"buttery", setting:"Biology lecture", title:"Navigation in Migratory Birds",
  s:"Today I want to look at how migratory birds find their way across thousands of kilometers, often on their first journey, without any guidance from adults. For a long time this was a genuine mystery. What we now know is that birds don't rely on a single system, they combine several. First, celestial cues. Many species navigate by the sun during the day and by the stars at night, and planetarium experiments in the sixties showed that young birds actually learn the rotation of the night sky around the pole star. Birds raised under a sky that rotated around a different star simply oriented themselves to that star. Second, and this is the part that still surprises people, birds can detect the Earth's magnetic field. The leading hypothesis is that light-sensitive proteins in the retina react to magnetism, which would mean a bird might literally see the field as a pattern overlaid on its vision. Third, familiar landmarks like coastlines become important near the end of the route. Now, the key concept here is redundancy. If clouds block the stars, the magnetic compass still works. If there's a magnetic storm, the sun is still there. No single cue is reliable all the time, but together they are remarkably robust.",
  qs:[
   {q:"What is the lecture mainly about?", o:["Why birds migrate in autumn","How birds combine several cues to navigate","The structure of the bird retina","Experiments on young birds in captivity"], a:1, ex:"Hauptthema: Kombination mehrerer Navigationssysteme."},
   {q:"What did the planetarium experiments demonstrate?", o:["Birds are born knowing the position of the pole star","Birds learn to orient themselves to the center of the sky's rotation","Birds cannot see stars indoors","Birds prefer to navigate by the sun"], a:1, ex:"Vögel unter einem Himmel, der sich um einen anderen Stern drehte, orientierten sich an diesem Stern. Sie lernen also das Rotationszentrum."},
   {q:"Why does the professor say birds \"might literally see the field\"?", o:["To describe a hypothesis about how magnetic sensing works","To criticize an outdated theory","To explain why birds avoid storms","To compare birds with insects"], a:0, ex:"Sie beschreibt die führende Hypothese (lichtempfindliche Proteine in der Netzhaut)."},
   {q:"What point does the professor make about redundancy?", o:["Birds waste energy by using several systems","The systems compensate for one another when one fails","Landmarks are the most important cue","Magnetic storms make navigation impossible"], a:1, ex:"Fällt ein Hinweisreiz aus, springt ein anderer ein."}
  ]},
 {id:"tk2", v:"glassy", setting:"Economics lecture", title:"Network Effects and Multi-Homing",
  s:"Let's turn to network effects. A product exhibits network effects when its value to each user increases as more people use it. The textbook example is the telephone. A single phone is worthless, two phones allow exactly one connection, but a million phones create an enormous number of possible connections. Digital platforms work similarly, but often with two sides. On a marketplace, sellers go where the buyers are, and buyers go where the sellers are. This feedback loop tends to produce winner-takes-most outcomes, which is why a handful of platforms dominate many markets. Now, students often conclude from this that dominant platforms are unassailable. That's too quick. What matters is how costly it is for users to participate in several platforms at once, what economists call multi-homing. Ride-hailing is a good case. Drivers and passengers frequently have two or three apps installed and simply compare prices. In that situation, network effects are weak, and a new entrant can compete. Contrast that with professional networks, where your entire history and contacts are locked into one site. So when you evaluate a platform's market power, don't just count users. Ask what it would take for those users to leave.",
  qs:[
   {q:"What is the main purpose of the talk?", o:["To argue that dominant platforms cannot be challenged","To explain network effects and what limits their power","To explain why the telephone succeeded as a product","To show that ride-hailing markets have strong network effects"], a:1, ex:"Netzwerkeffekte und was ihre Macht begrenzt (Multi-Homing)."},
   {q:"Why does the professor mention ride-hailing apps?", o:["As an example where network effects are relatively weak","To show that one company always dominates","To illustrate a one-sided market","To explain how prices are set"], a:0, ex:"Viele nutzen mehrere Apps gleichzeitig, also schwache Netzwerkeffekte."},
   {q:"What is the professor's attitude toward the conclusion that dominant platforms are \"unassailable\"?", o:["She considers it well supported","She thinks it is premature","She thinks it applies only to telephones","She is uncertain what it means"], a:1, ex:"„That's too quick.“"},
   {q:"Why are professional networks contrasted with ride-hailing?", o:["Users find it harder to switch because their data are locked in","They have fewer users","They are cheaper to use","They do not have network effects"], a:0, ex:"Historie und Kontakte sind auf einer Seite gebunden, also hohe Wechselkosten."}
  ]},
 {id:"tk3", v:"rounded", setting:"Art history lecture", title:"Impressionism and the Paint Tube",
  s:"When we discuss Impressionism, we tend to focus on the artists themselves. But technology played a role that's easy to overlook. Before the 1840s, painters typically ground their own pigments and mixed them with oil, and the result dried quickly once exposed to air. Storing paint in pig bladders was common, and they burst easily. So painting outdoors was impractical, and most finished landscapes were produced in the studio from sketches. Then, in 1841, an American portrait painter living in London patented the collapsible tin tube. Suddenly, artists could carry a full range of ready-mixed colors into the field. This made it feasible to complete a painting on site and to capture fleeting effects of light, which is exactly what the Impressionists became known for. Renoir reportedly remarked that without tubes there would have been no Impressionism. Now, I'd treat that with some caution. The movement also depended on new attitudes toward modern life, on the rejection of academic conventions, and on new exhibition practices. But the anecdote is useful because it reminds us that artistic change often has material preconditions.",
  qs:[
   {q:"What is the lecture mainly about?", o:["The biography of Renoir","The influence of a technical invention on an artistic movement","How pigments are manufactured","Why studios declined in popularity"], a:1, ex:"Einfluss der Farbtube auf den Impressionismus."},
   {q:"According to the professor, why was outdoor painting difficult before the 1840s?", o:["Landscape painting was not respected","Paint was hard to store and transport and dried quickly","Artists lacked training in landscape","Tin was too expensive"], a:1, ex:"Farbe trocknete schnell, Schweineblasen platzten leicht."},
   {q:"What is the professor's attitude toward Renoir's remark?", o:["She accepts it completely","She considers it an overstatement","She doubts that Renoir said anything about tubes","She thinks it applies only to portraits"], a:1, ex:"„I'd treat that with some caution“: Sie hält es für übertrieben."},
   {q:"What does the professor mean by \"material preconditions\"?", o:["The prices artists could charge","Physical tools and technologies that make new styles possible","The subjects that artists choose to paint","The rules of academic institutions"], a:1, ex:"Materielle Voraussetzungen = Werkzeuge und Technik, die neue Stile ermöglichen."}
  ]},
 {id:"tk4", v:"airy", setting:"Psychology lecture", title:"The Spacing Effect",
  s:"Let's talk about one of the most robust findings in learning research, the spacing effect. If you study material in several shorter sessions spread over time, you'll remember it far better than if you spend the same total time in a single block. This was first documented by Hermann Ebbinghaus in the 1880s, who tested himself on lists of nonsense syllables. Now, here's the puzzle. Students overwhelmingly prefer cramming, and when you ask them afterwards, they actually believe cramming worked better. Why? Because massed practice produces a feeling of fluency. The material seems familiar after the fourth repetition in a row, and that familiarity is mistaken for learning. With spacing, by contrast, you've partly forgotten the material by the next session, so retrieval feels effortful. But that effort is precisely what strengthens the memory. Researchers sometimes call these desirable difficulties. So the practical implication is somewhat counterintuitive. If studying feels easy, that's not necessarily a good sign. A rough guideline is to space reviews further apart as the exam gets further away. For a test in a week, reviewing every day or two works well. For an exam in a year, monthly reviews might be optimal.",
  qs:[
   {q:"What is the main topic of the lecture?", o:["The life of Hermann Ebbinghaus","Why distributing study sessions over time improves memory","How to memorize nonsense syllables","The disadvantages of studying in groups"], a:1, ex:"Spacing-Effekt."},
   {q:"According to the professor, why do students believe cramming works better?", o:["They receive higher grades after cramming","Repeated exposure creates a misleading sense of familiarity","Professors recommend it","They have more time before exams"], a:1, ex:"Flüssigkeitsgefühl wird mit Lernen verwechselt."},
   {q:"What does the professor mean by \"desirable difficulties\"?", o:["Tasks that are too hard to complete","Effortful retrieval that improves long-term retention","Exams with difficult questions","Distractions during study sessions"], a:1, ex:"Anstrengendes Abrufen stärkt das Gedächtnis."},
   {q:"What can be inferred about the ideal review schedule for a test in three months?", o:["Reviews should happen every hour","Reviews should be spaced further apart than for a test in a week","Only one review is necessary","Reviews should happen only on the day before"], a:1, ex:"Faustregel: Je weiter die Prüfung entfernt, desto größer die Abstände."}
  ]},
 {id:"tk5", v:"buttery", setting:"Environmental science lecture", title:"Urban Trees and Cooling",
  s:"Last week we looked at urban heat islands. Today I want to examine one of the most commonly proposed solutions, planting trees, and why the effect is more complicated than it first appears. Trees cool cities in two main ways. They provide shade, which keeps surfaces like asphalt from absorbing sunlight, and they release water vapor through their leaves, a process called evapotranspiration, which cools the surrounding air. Measurements show that a well-shaded street can be several degrees cooler at ground level. However, and this is often missed, the benefit depends heavily on the type of tree and on water availability. During a drought, trees close the pores in their leaves to conserve water, and evapotranspiration drops sharply, precisely when cooling is needed most. Dense canopies in narrow streets can also trap heat at night by blocking radiation from escaping upward. So cities are increasingly choosing drought-tolerant species and pairing tree planting with water management, for instance by directing rainwater into planting beds rather than storm drains. The broader lesson is that nature-based solutions need to be designed for the specific site, not simply copied from one city to another.",
  qs:[
   {q:"What is the main purpose of the lecture?", o:["To argue against planting trees in cities","To explain how trees cool cities and the conditions that limit this effect","To describe the history of urban planning","To compare heat islands in different countries"], a:1, ex:"Wie Bäume kühlen und welche Bedingungen den Effekt begrenzen."},
   {q:"According to the professor, why can trees provide less cooling during droughts?", o:["They lose their leaves completely","They reduce water release to conserve moisture","They absorb more sunlight","They grow more slowly"], a:1, ex:"Bäume schließen ihre Spaltöffnungen, also weniger Verdunstung."},
   {q:"Why does the professor mention narrow streets with dense canopies?", o:["To give an example of ideal tree placement","To show a situation in which trees can increase nighttime heat","To explain why trees grow better in narrow streets","To describe evapotranspiration"], a:1, ex:"Dichte Kronen halten nachts die Wärme fest."},
   {q:"What does the professor imply about nature-based solutions?", o:["They work the same way everywhere","They must be adapted to local conditions","They are more expensive than technical solutions","They should replace water management"], a:1, ex:"„designed for the specific site, not simply copied“."}
  ]},
 {id:"tk6", v:"glassy", setting:"Business lecture", title:"First-Mover Advantage",
  s:"There's a widespread belief in business that being first to market is a decisive advantage. The logic seems sound. The first mover can build brand recognition, lock in customers, and secure scarce resources like the best suppliers or locations. And there are cases where this holds. But when researchers looked systematically at market histories, the picture was much less flattering. A well-known study found that a large share of supposed market pioneers had actually failed, and that many of today's market leaders entered years after the pioneer. Think of search engines. The dominant company was nowhere near the first. So why do later entrants often win? First, pioneers bear the cost of educating customers about an entirely new product category. Second, they have to guess what customers want, while followers can observe the pioneer's mistakes and avoid them. Third, technology often shifts during the early years, so the pioneer's initial investments can become obsolete. That doesn't mean timing is irrelevant. First-mover advantages tend to be real when there are strong network effects or high switching costs. Otherwise, being a fast, well-informed follower is frequently the better strategy.",
  qs:[
   {q:"What is the main idea of the talk?", o:["Being first to market almost always guarantees success","The advantages of entering first are often overestimated","Search engines are the most competitive market","Companies should avoid new product categories"], a:1, ex:"First-Mover-Vorteil wird häufig überschätzt."},
   {q:"Why does the professor mention search engines?", o:["To give an example of a successful pioneer","To illustrate that a later entrant became the leader","To explain network effects","To describe customer education"], a:1, ex:"Der heutige Marktführer war nicht der Erste."},
   {q:"Which of the following is NOT given as a reason why followers often succeed?", o:["Pioneers must educate customers","Followers can learn from pioneers' mistakes","Followers usually have more capital","Technology changes can make early investments outdated"], a:2, ex:"Mehr Kapital wird nicht genannt (NOT-Frage)."},
   {q:"Under which condition does the professor say first-mover advantages are most likely to be real?", o:["When products are inexpensive","When network effects or switching costs are strong","When technology changes rapidly","When customers are well informed"], a:1, ex:"„when there are strong network effects or high switching costs“."}
  ]}
];

 {id:"ac5", title:"The Placebo Effect",
  text:"In clinical research, a placebo is an inert treatment, such as a sugar pill, given to participants who believe they may be receiving active medication. Remarkably, a substantial proportion of these participants report genuine improvements in symptoms, particularly for conditions involving pain, fatigue or nausea. For decades, researchers regarded this phenomenon merely as a nuisance that had to be controlled for in order to isolate the effect of the actual drug.\n\nMore recent work suggests that placebo responses are not imaginary but reflect measurable physiological changes. Brain imaging studies have shown that expectations of relief can trigger the release of endogenous opioids, the body's own painkillers. Intriguingly, the effect appears to depend on contextual cues: larger pills, branded packaging and even higher prices tend to produce stronger responses. Some studies have reported improvements even when patients were openly told that they were receiving a placebo, a finding that challenges the assumption that deception is essential. Ethicists remain cautious, however, noting that deliberately prescribing placebos could undermine trust between patients and physicians if not handled transparently.",

 {id:"ac6", title:"Medieval Trade Fairs",
  text:"Between the twelfth and fourteenth centuries, the fairs of Champagne in northeastern France became the commercial hub of medieval Europe. Six fairs rotated among four towns throughout the year, ensuring that merchants could trade almost continuously. Italian merchants brought spices, silk and dyes from the Mediterranean, while traders from Flanders offered high-quality woolen cloth. The counts of Champagne actively promoted these gatherings by guaranteeing safe conduct to travelers, maintaining roads and establishing special courts that resolved commercial disputes quickly.\n\nPerhaps the fairs' most lasting contribution was financial rather than material. Because merchants were reluctant to carry large quantities of coins over dangerous roads, they increasingly settled accounts through written obligations that could be cleared at the end of each fair. These practices laid the groundwork for later instruments such as bills of exchange. The decline of the fairs in the early fourteenth century is usually attributed to several factors, including the annexation of Champagne by the French crown, which imposed heavier taxes, and the opening of a direct sea route between Italy and Flanders that allowed merchants to bypass the region altogether.",
  qs:[
   {q:"According to paragraph 1, how did the counts of Champagne support the fairs?", o:["By lending money to foreign merchants","By providing security, infrastructure and legal services","By producing woolen cloth","By limiting the number of Italian traders"], a:1, ex:"Geleitschutz, Straßen und spezielle Gerichte."},
   {q:"Why did merchants begin to use written obligations?", o:["Coins were not accepted at the fairs","Carrying large amounts of money was risky","The counts required written contracts","Written records were cheaper to produce"], a:1, ex:"Sie scheuten das Risiko, viel Bargeld über gefährliche Straßen zu tragen."},
   {q:"The phrase \"laid the groundwork for\" is closest in meaning to", o:["replaced","prepared the basis for","prevented the use of","increased the cost of"], a:1, ex:"laid the groundwork = die Grundlage schaffen."},
   {q:"Which of the following is NOT mentioned as a reason for the decline of the fairs?", o:["Higher taxes after the region became part of France","A new maritime route between Italy and Flanders","A decline in the quality of Flemish cloth","Merchants being able to avoid the region"], a:2, ex:"Die Qualität des Tuchs wird nicht als Grund genannt (NOT-Frage)."},
   {q:"What can be inferred about the sea route mentioned in paragraph 2?", o:["It was more dangerous than the land routes","It reduced the need for merchants to meet in Champagne","It was controlled by the counts of Champagne","It was used mainly for transporting coins"], a:1, ex:"Händler konnten die Region umgehen, Champagne wurde also weniger gebraucht."}
  ]}
);

POOL.ltalk.push(
 {id:"tk7", v:"airy", setting:"Linguistics lecture", title:"Language Death",
  s:"Linguists estimate that roughly seven thousand languages are spoken today, but nearly half of them are considered endangered. A language is usually described as endangered when children are no longer learning it as their first language. Now, it's tempting to think that languages disappear because they're somehow less useful, but that's not really accurate. The main driver is social and economic pressure. When a dominant language is associated with education, jobs and prestige, parents often choose to raise their children in that language, sometimes deliberately, hoping to give them better opportunities. Within two or three generations, the original language may have only elderly speakers left. Why does this matter beyond the speakers themselves? Each language encodes specific knowledge, for instance detailed vocabulary for local plants, weather patterns or navigation, that often isn't documented anywhere else. That said, revitalization is possible. Welsh is the example people usually cite. Through bilingual schooling and media, the number of young speakers has actually grown. But I'd caution against assuming the Welsh model transfers easily, because it depended on strong political support and resources that many small communities simply don't have.",
  qs:[
   {q:"What is the main topic of the lecture?", o:["The history of the Welsh language","Why languages become endangered and whether they can be revived","How children acquire their first language","The number of languages spoken in Europe"], a:1, ex:"Ursachen des Sprachsterbens und Möglichkeiten der Wiederbelebung."},
   {q:"According to the professor, what is the main cause of language endangerment?", o:["Languages becoming grammatically too complex","Social and economic pressure toward a dominant language","A lack of written dictionaries","Government bans on minority languages"], a:1, ex:"„The main driver is social and economic pressure.“"},
   {q:"Why does the professor mention vocabulary for plants and weather?", o:["To show that endangered languages are simpler","To illustrate the unique knowledge languages can contain","To explain how linguists count languages","To argue that dominant languages lack such words"], a:1, ex:"Beispiel für Wissen, das nur in dieser Sprache dokumentiert ist."},
   {q:"What is the professor's attitude toward the Welsh example?", o:["She thinks it proves revitalization always works","She sees it as encouraging but not easily repeated elsewhere","She believes the statistics are inaccurate","She thinks Welsh is still declining"], a:1, ex:"„I'd caution against assuming the Welsh model transfers easily“."}
  ]},
 {id:"tk8", v:"glassy", setting:"Engineering lecture", title:"Why Bridges Sway",
  s:"In the year 2000, a new pedestrian bridge opened in London and had to be closed after only two days because it swayed noticeably from side to side. The engineers had checked the structure for wind and for the weight of the crowd, so what went wrong? It turned out the problem was the pedestrians themselves. When a bridge moves sideways even slightly, people instinctively adjust their walking to keep their balance. They widen their stance and, without realizing it, start stepping in time with the movement. And here's the key point. That synchronized stepping pushes the bridge further in the same direction, which makes the movement larger, which in turn causes more people to fall into step. Engineers call this a positive feedback loop. Interestingly, the effect only appears once the crowd reaches a critical size. Below that threshold, people's random steps cancel each other out. The solution wasn't to rebuild the bridge but to install dampers, devices that absorb the energy of the motion, a bit like shock absorbers in a car. Since then, design codes in many countries require engineers to check footbridges for this kind of crowd behavior.",
  qs:[
   {q:"What is the lecture mainly about?", o:["How wind affects bridge design","How pedestrians unintentionally caused a bridge to sway","The history of bridges in London","Why car shock absorbers were invented"], a:1, ex:"Fußgänger haben das Schwanken unbeabsichtigt verstärkt."},
   {q:"According to the professor, why did the problem appear only with large crowds?", o:["Small groups walked more slowly","Below a certain number, random steps cancel each other out","The bridge was only weak in the middle","Large crowds were heavier than expected"], a:1, ex:"Unterhalb der kritischen Größe heben sich die Schritte auf."},
   {q:"Why does the professor compare dampers to shock absorbers?", o:["To explain how dampers work using a familiar example","To suggest that cars caused the problem","To show that dampers are cheap","To argue that the bridge should be rebuilt"], a:0, ex:"Vertrauter Vergleich zur Erklärung."},
   {q:"What can be inferred about engineering practice after this event?", o:["Footbridges are no longer built in cities","Engineers now consider how crowds move on footbridges","Dampers are banned in new bridges","Wind is no longer tested in design"], a:1, ex:"Normen verlangen jetzt die Prüfung auf solches Verhalten."}
  ]}
);

 {id:"tk9", v:"buttery", setting:"Marketing lecture", title:"The Decoy Effect",
  s:"Okay, so let's talk about something called the decoy effect. Imagine a coffee shop sells a small coffee for three dollars and a large for five. A lot of people go small, right? Now, here's the trick. The shop adds a medium for four seventy-five. Almost nobody buys the medium, but suddenly sales of the large go way up. Why? Because next to the medium, the large looks like a bargain, you're getting a lot more coffee for just a quarter more. The medium isn't really there to be sold. It's a decoy, and its job is to make another option look better. Now, you might think, well, that's irrational, and in a sense it is. Classical economics says adding an option nobody wants shouldn't change your choice between the other two. But study after study shows it does. A famous example involved magazine subscriptions, where adding a print-only option at the same price as print plus online made the combined package way more popular. I'd just add one caution, though. Some recent replications found the effect is smaller than the early studies suggested, especially when people are already familiar with the products.",
  qs:[
   {q:"What is the main purpose of the lecture?", o:["To explain how a less attractive option can change consumer choices","To compare coffee prices in different shops","To argue that classical economics is always wrong","To describe the history of magazine subscriptions"], a:0, ex:"Der Decoy-Effekt: Eine unattraktive Option verändert die Wahl."},
   {q:"Why does the professor mention the medium coffee?", o:["As an example of a popular product","As an example of a decoy that makes the large look better","To show that customers prefer middle options","To explain why prices increase"], a:1, ex:"Die mittlere Größe ist der Köder."},
   {q:"According to the professor, why is the decoy effect considered irrational?", o:["Because customers spend more than they planned","Because an unwanted option should not affect choices between the others","Because shops lose money on decoys","Because people cannot compare prices"], a:1, ex:"Klassische Ökonomie: Eine ungewollte Option sollte nichts ändern."},
   {q:"What is the professor's attitude toward the early research?", o:["She thinks it was completely wrong","She thinks the effect may have been overstated","She thinks it applies only to coffee","She thinks it has never been replicated"], a:1, ex:"Neuere Replikationen fanden kleinere Effekte."}
  ]},
 {id:"tk10", v:"airy", setting:"Biology lecture", title:"Why Zebras Have Stripes",
  s:"So, why do zebras have stripes? This is one of those questions that sounds simple, but scientists argued about it for over a century. The classic answer was camouflage, the idea that stripes confuse predators like lions. But, honestly, that never really held up. Lions hunt mostly at dusk, and at that distance, research suggests the stripes just blur into gray anyway. Another idea was temperature control, that stripes create little air currents that cool the animal. Some data support that, but the effect seems pretty small. The explanation with the strongest evidence right now is, believe it or not, flies. Biting flies, like horseflies, carry diseases that are a real threat in Africa. In one clever experiment, researchers put striped coats on horses and filmed the flies. The flies approached just as often, but they failed to land, they kind of overshot or bumped into the horse. It seems stripes mess with the flies' vision as they come in to land. So the current thinking is that stripes are mainly an anti-fly adaptation, though they could well have more than one function.",
  qs:[
   {q:"What is the lecture mainly about?", o:["How lions hunt zebras","Competing explanations for zebra stripes","How horseflies spread disease","Temperature regulation in African mammals"], a:1, ex:"Verschiedene Erklärungen für Zebrastreifen."},
   {q:"Why does the professor doubt the camouflage explanation?", o:["Lions are color-blind","At hunting distance and time, the stripes look uniform","Zebras live in open grassland","Camouflage has never been studied"], a:1, ex:"Bei Dämmerung und Distanz verschwimmen die Streifen zu Grau."},
   {q:"Why does the professor describe the experiment with horses?", o:["To show that horses are attacked by more flies","To provide evidence that stripes prevent flies from landing","To explain how zebras were domesticated","To compare horses and zebras"], a:1, ex:"Fliegen landeten auf gestreiften Mänteln seltener."},
   {q:"What can be inferred about the professor's view?", o:["She considers the fly explanation fully settled","She finds the fly explanation most convincing but remains open to others","She thinks temperature control is the main reason","She believes the question cannot be answered"], a:1, ex:"„could well have more than one function“."}
  ]},
 {id:"tk11", v:"glassy", setting:"Urban studies lecture", title:"Induced Demand",
  s:"Let's talk about traffic, 'cause there's a pretty counterintuitive idea here called induced demand. So, a city's got a congested highway, and the obvious fix is, well, add a lane, right? More space, less traffic. And for a few months, that's exactly what happens. But then, slowly, traffic creeps back. Within a few years, it's often just as bad as before, sometimes worse. Why? Because when driving gets easier, people change their behavior. Folks who used to take the train start driving. People take trips they used to skip. Some even move further out because the commute seems shorter. The new capacity basically gets filled. There's a famous example from Houston, where one highway was widened to something like twenty-six lanes, and commute times actually got longer afterward. Now, I don't want to oversimplify. Adding capacity can make sense in some situations, like a bottleneck at a bridge. But as a general strategy for fixing congestion, most transportation researchers now favor things like congestion pricing or better transit.",
  qs:[
   {q:"What is the main topic of the lecture?", o:["The history of highways in Houston","Why adding road capacity often fails to reduce congestion","How to design train systems","Why people move to the suburbs"], a:1, ex:"Induzierte Nachfrage."},
   {q:"According to the professor, what happens after a new lane opens?", o:["Traffic permanently decreases","Traffic decreases at first but later returns","Accidents increase immediately","Train ridership rises"], a:1, ex:"Erst Entlastung, dann kommt der Verkehr zurück."},
   {q:"Why does the professor mention Houston?", o:["To give an example where widening a highway did not shorten commutes","To praise its public transit","To show a city with no congestion","To describe a famous bridge"], a:0, ex:"Trotz Verbreiterung wurden die Pendelzeiten länger."},
   {q:"What is the professor's attitude toward adding road capacity?", o:["It never makes sense","It can be useful in specific cases but is not a general solution","It is the best solution to congestion","It should replace congestion pricing"], a:1, ex:"„can make sense in some situations … But as a general strategy …“."}
  ]},
 {id:"tk12", v:"rounded", setting:"Psychology lecture", title:"The Testing Effect",
  s:"Quick question before we start. How do most of you study for exams? Let me guess. You reread your notes, maybe highlight stuff. Yeah. Well, here's the thing. Research pretty consistently shows that's one of the least effective strategies. What works way better is something called retrieval practice, or the testing effect. Basically, instead of rereading, you close the book and try to recall the material, like with flashcards or practice questions. In one well-known study, students read a passage and then either reread it or took a recall test on it. After five minutes, the rereaders actually did a bit better. But after a week, the group that had tested themselves remembered way more. So the benefit doesn't show up right away, which is exactly why people don't trust it. Rereading feels productive, testing yourself feels hard and kind of frustrating. And one more thing. It works even if you get the answers wrong at first, as long as you check the correct answer afterward.",
  qs:[
   {q:"What is the main point of the lecture?", o:["Highlighting is the best study method","Testing yourself improves long-term memory more than rereading","Students should study in groups","Exams should be easier"], a:1, ex:"Abrufüben schlägt Wiederlesen langfristig."},

  const el = document.createElement(tag);

    if (k==='class') el.className = v;
    else if (k==='svg') el.innerHTML = v; /* static icon markup written in this file only */

const hasBrowserTTS = () => 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
function audioEngine(){
  if (TTS_OFF) return null;
  if (SETTINGS.audio==='browser' && hasBrowserTTS()) return 'browser';
  if (TTS) return 'claude';
  if (hasBrowserTTS()) return 'browser';
  return null;
}
const ACCENT_OF = {buttery:'en-US', airy:'en-GB', glassy:'en-AU', rounded:'en-US'};
function browserVoice(v){
  const all = (speechSynthesis.getVoices()||[]).filter(x=>/^en/i.test(x.lang));
  const want = ACCENT_OF[v]||'en-US';
  const exact = all.filter(x=>x.lang.replace('_','-')===want);
  if (exact.length) return exact[v==='rounded' && exact.length>1 ? 1 : 0];
  return all[0]||null;
}
/* play a list of {text, voice}; resolves when finished; rejects {code} */
function play(lines){
  const eng = audioEngine();
  if (!eng) return Promise.reject({code:'none'});
  if (eng==='claude'){
    return TTS.speak(lines.map((l,i)=>({text:l.text, voice:l.voice||'buttery', language:'en', id:'l'+i})), {rate:SETTINGS.rate, language:'en'})
      .catch(e => { if (e && e.code==='not_granted') TTS_OFF=true; throw e; });
  }
  return new Promise((res, rej) => {
    speechSynthesis.cancel();
    let i = 0; let stopped = false;
    play._cancel = () => { stopped = true; speechSynthesis.cancel(); rej({code:'stopped'}); };
    const next = () => {
      if (stopped) return;
      if (i>=lines.length){ ttsSink.state && ttsSink.state({state:'idle', reason:'completed'}); return res({}); }
      const l = lines[i]; const u = new SpeechSynthesisUtterance(l.text);
      const vo = browserVoice(l.voice); if (vo){ u.voice = vo; u.lang = vo.lang; } else u.lang='en-US';
      u.rate = SETTINGS.rate; const idx=i;
      u.onstart = () => { ttsSink.state && ttsSink.state({state:'speaking'}); ttsSink.line && ttsSink.line({line:idx}); };
      u.onend = () => { i++; next(); };
      u.onerror = (ev) => { if (!stopped) rej({code:'upstream_error'}); };
      speechSynthesis.speak(u);
    };
    next();
  });
}
function stopAudio(){
  try{ if (TTS && TTS.active()) TTS.stop(); }catch(e){}
  try{ if (play._cancel) { play._cancel(); play._cancel=null; } else if (hasBrowserTTS()) speechSynthesis.cancel(); }catch(e){}
}

function fmt(s){ s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function tick(){
  const el = document.getElementById('clock'); const now = Date.now();
  for (const k of ['section','unit']){
    const c = CLOCK[k];

/* ---------- text helpers ---------- */
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = {20:'twenty',30:'thirty',40:'forty',50:'fifty',60:'sixty',70:'seventy',80:'eighty',90:'ninety'};
function numWord(n){ n=+n; if (n<20) return NUMW[n]; if (n<100){ const t=Math.floor(n/10)*10, r=n%10; return TENS[t]+(r?' '+NUMW[r]:''); } return String(n); }
function words(s){
  return s.toLowerCase().replace(/(\d+):(\d+)/g,(m,a,b)=>a+' '+(b==='00'?'':b)).replace(/\d+/g,m=>numWord(m))
    .replace(/[’]/g,"'").replace(/[^a-z' ]+/g,' ').replace(/'s\b/g,'s').split(/\s+/).filter(Boolean);
}
function lcsMatch(ref, hyp){
  const n=ref.length, m=hyp.length, d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) d[i][j] = ref[i]===hyp[j] ? d[i+1][j+1]+1 : Math.max(d[i+1][j], d[i][j+1]);
  const hit = new Array(n).fill(false); let i=0,j=0;
  while(i<n&&j<m){ if(ref[i]===hyp[j]){hit[i]=true;i++;j++;} else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  return {count:d[0][0], hit};
}
function repeatScore(ref, said){
  const r=words(ref), s=words(said||''); if(!s.length) return {score:0, acc:0, hit:new Array(r.length).fill(false)};
  const {count, hit} = lcsMatch(r, s); const extra = Math.max(0, s.length - count);
  const acc = Math.max(0, (count - extra*0.5)/r.length);
  const score = (acc>=0.999 && extra===0)?5 : acc>=0.9?4 : acc>=0.75?3 : acc>=0.45?2 : acc>0?1 : 0;
  return {score, acc, hit};
}
const wordCount = s => (s||'').trim().split(/\s+/).filter(Boolean).length;
function shuffleSeeded(arr, seedStr){
  let seed=0; for(const c of seedStr) seed=(seed*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;
}

/* ---------- complete-the-words builder ---------- */
const CWC = {};
function cwBuild(item){
  if (CWC[item.id]) return CWC[item.id];
  const m = item.text.match(/^.*?[.!?](\s|$)/);
  const first = m ? m[0] : '';
  const rest = item.text.slice(first.length);
  const parts = rest.match(/[A-Za-z]+|[^A-Za-z]+/g) || [];
  let wi=0, blanks=0; const toks=[];
  for (const p of parts){
    /* never blank capitalised words: names, places and sentence starts test knowledge, not English */
    if (/^[A-Za-z]+$/.test(p) && p.length>=2 && !/^[A-Z]/.test(p)){
      const isBlank = (wi%2===1) && blanks<10; wi++;
      if (isBlank){ const keep=Math.max(1,Math.floor(p.length/2)); toks.push({stem:p.slice(0,keep), miss:p.slice(keep), b:blanks++}); continue; }
    }
    toks.push({t:p});
  }
  return CWC[item.id] = {first, toks, n:blanks};
}

function knownInMock(mock){ const done=store.get('done',{}); const out=[]; for (const k of ['reading','listening','writing','speaking']) for (const t of Object.keys(mock[k])) for (const id of mockIds(mock,k,t)) if (done[t+':'+id]) out.push({t,id,orig:(mock[k][t]||[])[mockIds(mock,k,t).indexOf(id)]}); return out; }
async function refreshMock(mock, onStep){
